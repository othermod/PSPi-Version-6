name: Build PCIE Overlay

on:
  workflow_call:
  push:
    paths:
      - 'rpi/pcie/**'
      - 'Dockerfile'
      - 'Makefile'
      - '.github/actions/make/**'
  pull_request:
    paths:
      - 'rpi/pcie/**'
      - 'Dockerfile'
      - 'Makefile'
      - '.github/actions/make/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        uses: ./.github/actions/make
        with:
          target: pcie

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pcie
          path: out/pcie/*.dtbo
