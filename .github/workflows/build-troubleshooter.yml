name: Build Troubleshooter

on:
  workflow_call:
  push:
    paths:
      - 'rpi/troubleshooter/**'
  pull_request:
    paths:
      - 'rpi/troubleshooter/**'
  workflow_dispatch:

jobs:
  build:
    # Native arm64 runner (free for public repos since GA Aug 2025; this repo
    # is public). troubleshooter is arm64-only by design, so compiling natively
    # avoids the whole amd64-host multiarch dance: no dpkg --add-architecture,
    # no mirror surgery, no :arm64 package suffixes -- plain native libdrm-dev,
    # gcc, and make.
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libdrm-dev gcc make

      - name: Build
        run: |
          cd rpi/troubleshooter
          make 64 CC_64=gcc

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: troubleshooter
          path: rpi/troubleshooter/64