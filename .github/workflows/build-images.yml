name: Release Images

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version string (e.g. 1.0.0)'
        required: true
      distro:
        description: 'Single distro to build (optional, for testing)'
        required: false
      target:
        description: 'Single target to build (optional, for testing)'
        required: false

permissions:
  contents: write

jobs:
  build-gamepad:
    uses: ./.github/workflows/build-gamepad.yml

  build-battery:
    uses: ./.github/workflows/build-battery.yml

  build-rtc:
    uses: ./.github/workflows/build-rtc.yml

  build-firmware:
    uses: ./.github/workflows/build-firmware.yml

  build-atmega:
    uses: ./.github/workflows/build-atmega.yml

  build-audio:
    uses: ./.github/workflows/build-audio.yml

  build-lcd:
    uses: ./.github/workflows/build-lcd.yml

  build-pcie:
    uses: ./.github/workflows/build-pcie.yml

  build-wifi:
    uses: ./.github/workflows/build-wifi.yml

  build-gamepad-view:
    uses: ./.github/workflows/build-gamepad-view.yml

  collect-artifacts:
    needs: [build-gamepad, build-battery, build-rtc, build-firmware, build-atmega, build-audio, build-lcd, build-pcie, build-wifi, build-gamepad-view]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '*'
          path: drivers-bin/

      - name: Upload combined artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pspi-driver-binaries
          path: drivers-bin/

  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate build matrix
        id: matrix
        env:
          INPUT_DISTRO: ${{ github.event.inputs.distro }}
          INPUT_TARGET: ${{ github.event.inputs.target }}
        run: |
          set -euo pipefail

          # Restrict to one distro if requested, otherwise use every distro config
          distro_files=(scripts/distros/*.sh)
          if [[ -n "$INPUT_DISTRO" ]]; then
            if [[ ! -f "scripts/distros/${INPUT_DISTRO}.sh" ]]; then
              echo "ERROR: Unknown distro '$INPUT_DISTRO'. Available: $(basename -a -s .sh scripts/distros/*.sh | tr '\n' ' ')" >&2
              exit 1
            fi
            distro_files=("scripts/distros/${INPUT_DISTRO}.sh")
          fi

          pairs=()
          for distro_file in "${distro_files[@]}"; do
            distro=$(basename "$distro_file" .sh)
            targets=$(bash -c "source '$distro_file' 2>/dev/null && echo \"\${ALL_TARGETS[*]}\"")
            if [[ -z "$targets" ]]; then
              echo "ERROR: No ALL_TARGETS found in $distro_file" >&2
              exit 1
            fi
            for target in $targets; do
              # Skip targets the caller filtered out
              if [[ -n "$INPUT_TARGET" && "$target" != "$INPUT_TARGET" ]]; then
                continue
              fi
              pairs+=("$distro $target")
            done
          done

          if [[ ${#pairs[@]} -eq 0 ]]; then
            echo "ERROR: No builds match distro='$INPUT_DISTRO' target='$INPUT_TARGET'" >&2
            exit 1
          fi

          matrix=$(printf '%s\n' "${pairs[@]}" | jq -Rcn '[inputs | split(" ") | {distro: .[0], target: .[1]}]')
          echo "Building ${#pairs[@]} image(s): ${pairs[*]}"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build-images:
    needs: [collect-artifacts, generate-matrix]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download driver binaries
        uses: actions/download-artifact@v4
        with:
          name: pspi-driver-binaries
          path: drivers-bin/

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ github.event.inputs.version }}"
            # Strip any stray whitespace so it can't be word-split by unquoted
            # uses (filenames, artifact patterns, release tag).
            VERSION="${VERSION//[[:space:]]/}"
            VERSION="${VERSION#[vV]}"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            squashfs-tools \
            e2fsprogs \
            zerofree \
            qemu-user-static \
            binfmt-support \
            gcc-12-aarch64-linux-gnu \
            gcc-12-arm-linux-gnueabihf \
            gcc-14-aarch64-linux-gnu \
            libc6-arm64-cross \
            libc6-armhf-cross \
            libc6-dev-arm64-cross \
            libc6-dev-armhf-cross \
            kmod \
            curl \
            wget \
            util-linux

      - name: Build image
        run: |
          sudo GITHUB_WORKSPACE="$GITHUB_WORKSPACE" ./scripts/patcher.sh \
            --distro "${{ matrix.distro }}" \
            --version "${{ steps.version.outputs.version }}" \
            --driver-binaries "$(pwd)/drivers-bin" \
            --target "${{ matrix.target }}"

      - name: Upload build artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: pspi-images-${{ steps.version.outputs.version }}-${{ matrix.distro }}-${{ matrix.target }}
          path: ${{ github.workspace }}/pspi/patched_images/
          retention-days: 14

  package-binaries:
    needs: [collect-artifacts]
    runs-on: ubuntu-latest
    steps:
      - name: Download driver binaries
        uses: actions/download-artifact@v4
        with:
          name: pspi-driver-binaries
          path: staging/


      - name: Package
        run: tar -czf pspi-binaries.tar.gz -C staging .

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: pspi-binaries
          path: pspi-binaries.tar.gz

  release:
    needs: [build-images, package-binaries]
    runs-on: ubuntu-latest
    steps:
      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ github.event.inputs.version }}"
            # Strip any stray whitespace so it can't be word-split by unquoted
            # uses (filenames, artifact patterns, release tag).
            VERSION="${VERSION//[[:space:]]/}"
            VERSION="${VERSION#[vV]}"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: pspi-images-${{ steps.version.outputs.version }}-*
          path: ${{ github.workspace }}/pspi/patched_images/
          merge-multiple: true
      - name: Install 7-Zip
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full

      - name: Split large images
        run: |
          shopt -s nullglob
          for img in "${{ github.workspace }}"/pspi/patched_images/*.img.xz; do
            # GitHub's per-file release asset limit is 2 GiB (2147483648 B).
            # Only split if the image is at or over the limit; a smaller image
            # is uploaded unsplit as a single .img.xz.
            size=$(stat -c%s "$img")
            if (( size >= 2147483648 )); then
              # -mx0 = store only, no re-compression (the .img.xz is already compressed)
              # 7z volumes are self-describing: opening the .001 file in 7-Zip/WinRAR
              # auto-finds the rest, on Windows, macOS, and Linux alike.
              # -v1950m (binary MiB) keeps each volume below the 2 GiB ceiling.
              7z a -v1950m -mx0 "$img.7z" "$img"
              rm "$img"
            fi
          done
          shopt -u nullglob

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: pspi-binaries
          path: release-assets/

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          shopt -s nullglob
          mv "release-assets/pspi-binaries.tar.gz" "release-assets/pspi-binaries-v${VERSION}.tar.gz"
          gh release create "v${VERSION}" --draft --title "v${VERSION}" \
            ${{ github.workspace }}/pspi/patched_images/*.img.xz.7z.* \
            ${{ github.workspace }}/pspi/patched_images/*.img.xz \
            "release-assets/pspi-binaries-v${VERSION}.tar.gz" \
            --notes-file .github/workflows/release.md \
            --repo "$GITHUB_REPOSITORY"
          shopt -u nullglob
