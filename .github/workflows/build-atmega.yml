name: Build ATmega Firmware

on:
  workflow_call:
  push:
    paths:
      - 'atmega/**'
      - 'Dockerfile'
      - 'Makefile'
      - '.github/actions/make/**'
  pull_request:
    paths:
      - 'atmega/**'
      - 'Dockerfile'
      - 'Makefile'
      - '.github/actions/make/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        uses: ./.github/actions/make
        with:
          target: atmega

      # The artifact root must contain the three hexes directly:
      # scripts/distros/firmware.sh reads
      # $DRIVER_BINARIES_DIR/atmega-firmware/firmware.hex.
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: atmega-firmware
          path: out/atmega-firmware/*
